[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kuhgunggeng"
version = "0.1.0"
description = "Philippine crab identification assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "pillow>=11.1,<13", "numpy>=2.2,<3", "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.20,<2"]
training = ["torch>=2.6,<3", "torchvision>=0.21,<1", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "ultralytics>=8.3,<9"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
include = ["backend*", "ml*"]

[tool.setuptools.package-data]
backend = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
